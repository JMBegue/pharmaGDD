version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: api
        working_dir: /var/www
        environment:
            APP_ENV: local
            APP_DEBUG: true
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_USERNAME: laravel
            DB_PASSWORD: laravel
            DB_DATABASE: laravel
        volumes:
            - .:/var/www:cached
        ports:
            - "8000:8000"
        depends_on:
            - mysql
        networks:
            - app-network

    mysql:
        image: mysql:8.0
        container_name: mysql
        command: '--default-authentication-plugin=mysql_native_password'
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: laravel
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network

volumes:
    mysql_data:

networks:
    app-network:
        driver: bridge
